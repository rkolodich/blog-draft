name: Deploy blog

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  cache: true

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Done
              run: echo Done
